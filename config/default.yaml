llm:
  provider: llama-server
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.5-4b
  model_path: /home/ameya/Downloads/Qwen3.5-4B-Q4_K_M.gguf
  fallback_model_path: /home/ameya/Downloads/Qwen3.5-4B-Q4_K_M.gguf
  multimodal: false
  mmproj_path: models/vision/mmproj-Qwen2-VL-2B-Instruct-f16.gguf
  max_tokens: 400
  context_window: 16384
  enable_thinking: false
  stream: true
  gemini:
    api_key: [REDACTED_API_KEY]
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.1-flash-lite
    fallback_models:
    - gemini-3.5-flash-lite
    - gemini-flash-lite-latest
    - gemini-3.6-flash
    - gemini-3.5-flash
    context_window: 1000000
    max_tokens: 4096
  openai_compatible:
    api_key: ''
    base_url: https://api.openai.com/v1
    model: gpt-4o
    fallback_models:
    - gpt-4o-mini
    - deepseek-chat
    context_window: 128000
    max_tokens: 4096
    enable_prompt_caching: true
stt:
  provider: whisper-server
  url: http://127.0.0.1:8081/inference
  model: /home/ameya/whisper.cpp/models/ggml-base.en
  model_path: /home/ameya/whisper.cpp/models/ggml-base.en.bin
  language: en
  temperature: 0.0
  chunk_seconds: 0.8
tts:
  provider: piper
  model_path: models/tts/en-us-lessac-medium.onnx
  sample_rate: 16000
audio:
  sample_rate: 16000
  vad_frame_size: 512
  silence_threshold_ms: 130
  barge_in_enabled: true
  barge_in_frames: 3
  barge_in_confidence: 0.55
  normal_confidence: 0.5
  energy_threshold: 0.005
  barge_in_energy: 0.008
  echo_coupling_ratio: 0.4
  echo_guard_confidence: 0.85
  echo_guard_energy: 0.02
  pre_roll_ms: 300
  playback_block_ms: 50
  echo_guard_s: 0.35
  barge_in_cooldown_s: 0.35
  wake_word:
    enabled: true
    require_wake_word: true
    follow_up_timeout_s: 12.0
    cooldown_s: 0.0
    confidence_threshold: 0.5
    wake_words:
    - hey neo
    - neo
    - hey cypher
    - cypher
    - hey luna
    - luna
    - hey aria
    - aria
    - hey glados
    - glados
    - hey robot
    - robot
    - wake up
expression:
  lighting:
    enabled: true
    backend: asusctl
vision:
  enabled: true
  camera_index: 1
  width: 320
  height: 240
  fps: 30
  perception_fps: 5.0
  yunet_model_path: models/vision/face_detection_yunet.onnx
  yolo_model_path: models/vision/yolov8n.pt
  enable_motion: true
memory:
  provider: mem0
  vector_store:
    provider: qdrant
    path: data/memory/qdrant
    collection: robot_memory
    embedding_dims: 384
  llm:
    provider: openai
    base_url: http://127.0.0.1:8080/v1
    model: Qwen3.5-4B-Q4_K_M
    api_key: not-needed
  embedder:
    provider: fastembed
    model: BAAI/bge-small-en-v1.5
    cache_dir: models/fastembed
  score_threshold: 0.82
history:
  database_path: data/database/conversations.db
personality:
  default: neo
  directory: config/personalities
api:
  host: 127.0.0.1
  port: 8888
context_budget:
  system_personality: 600
  tool_schemas: 1500
  retrieved_memories: 2000
  recent_conversation: 9000
  world_state: 300
  robot_state: 200
  generation_headroom: 1500
logging:
  level: INFO
  directory: logs
  structured: true
latency:
  vad_target_ms: 30
  stt_partial_target_ms: 500
  stt_final_target_ms: 300
  llm_ttft_target_ms: 400
  llm_generation_target_ms: 1200
  tool_target_ms: 50
  tts_first_audio_target_ms: 150
  avatar_target_ms: 50
  e2e_first_audio_target_ms: 900
observability:
  enabled: true
  max_trace_history: 250
  redact_sensitive_data: true
  websocket_enabled: true
image:
  enabled: true
  provider: unified
  default_model: sd-turbo
  gpu_offload_heavy: true
  default_width: 512
  default_height: 512
  default_steps: 4
  max_width: 1024
  max_height: 1024
  max_steps: 50
  max_concurrent_jobs: 1
  output_dir: data/images
