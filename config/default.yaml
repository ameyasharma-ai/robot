# Robot Core — Default Configuration

llm:
  provider: llama-server
  base_url: "http://127.0.0.1:8080/v1"
  model: "Qwen3.5-4B-Q4_K_M"
  max_tokens: 300
  context_window: 16384
  enable_thinking: false
  stream: true

stt:
  provider: whisper-server
  url: "http://127.0.0.1:8081/inference"
  language: "en"
  temperature: 0.0

tts:
  provider: piper
  model_path: "models/tts/en-us-lessac-medium.onnx"
  sample_rate: 22050

audio:
  sample_rate: 16000
  vad_frame_size: 512       # 32ms at 16kHz
  silence_threshold_ms: 650
  barge_in_enabled: false   # Completely deaf to its own voice while speaking (prevents self-interruption)
  barge_in_frames: 5        # Consecutive speech frames required to interrupt (if barge-in enabled)
  barge_in_confidence: 0.88 # High confidence required during playback
  normal_confidence: 0.45
  energy_threshold: 0.003
  barge_in_energy: 0.045    # User voice near mic exceeds 0.045
  echo_guard_confidence: 0.80
  echo_guard_energy: 0.025
  pre_roll_ms: 600
  playback_block_ms: 30
  echo_guard_s: 0.4
  barge_in_cooldown_s: 0.5

memory:
  provider: mem0
  vector_store:
    provider: qdrant
    host: localhost
    port: 6333
    collection: robot_memory
    embedding_dims: 768
  llm:
    provider: openai
    base_url: "http://127.0.0.1:8080/v1"
    model: "Qwen3.5-4B-Q4_K_M"
    api_key: "not-needed"
  embedder:
    provider: openai
    base_url: "http://127.0.0.1:8080/v1"
    model: "Qwen3.5-4B-Q4_K_M"
    api_key: "not-needed"

history:
  database_path: "data/database/conversations.db"

personality:
  default: "neo"
  directory: "config/personalities"

api:
  host: "127.0.0.1"
  port: 8888

context_budget:
  system_personality: 1500
  tool_schemas: 2000
  retrieved_memories: 2000
  recent_conversation: 5000
  world_state: 750
  robot_state: 375
  generation_headroom: 3500

logging:
  level: "INFO"
  directory: "logs"
  structured: true
