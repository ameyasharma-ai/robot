# Robot Core — Default Configuration

llm:
  provider: llama-server
  base_url: "http://127.0.0.1:8080/v1"
  model: "Qwen3.5-4B-Q4_K_M"
  max_tokens: 300
  context_window: 16384
  enable_thinking: false
  stream: true

stt:
  provider: whisper-server
  url: "http://127.0.0.1:8081/inference"
  language: "en"
  temperature: 0.0

tts:
  provider: piper
  model_path: "models/tts/en-us-lessac-medium.onnx"
  sample_rate: 22050

audio:
  sample_rate: 16000
  vad_frame_size: 512       # 32ms at 16kHz
  silence_threshold_ms: 650
  barge_in_enabled: true    # Barge-in enabled via reference echo subtraction
  barge_in_frames: 2        # ~64ms consecutive speech required to interrupt
  barge_in_confidence: 0.65 # High confidence required during playback
  normal_confidence: 0.45
  energy_threshold: 0.003
  barge_in_energy: 0.008    # User voice near mic exceeds threshold
  echo_coupling_ratio: 0.16 # Measured acoustic leakage ratio from speakers to internal mic
  echo_guard_confidence: 0.70
  echo_guard_energy: 0.008
  pre_roll_ms: 600
  playback_block_ms: 30
  echo_guard_s: 0.35
  barge_in_cooldown_s: 0.3

expression:
  lighting:
    enabled: true
    backend: "asusctl"   # Direct DBus to asusd with CLI fallback

vision:
  enabled: true
  camera_index: 0
  width: 640
  height: 480
  fps: 60
  perception_fps: 5.0
  yunet_model_path: "models/vision/face_detection_yunet.onnx"
  yolo_model_path: "models/vision/yolov8n.pt"
  enable_motion: true

memory:
  provider: mem0
  vector_store:
    provider: qdrant
    host: localhost
    port: 6333
    collection: robot_memory
    embedding_dims: 768
  llm:
    provider: openai
    base_url: "http://127.0.0.1:8080/v1"
    model: "Qwen3.5-4B-Q4_K_M"
    api_key: "not-needed"
  embedder:
    provider: openai
    base_url: "http://127.0.0.1:8080/v1"
    model: "Qwen3.5-4B-Q4_K_M"
    api_key: "not-needed"

history:
  database_path: "data/database/conversations.db"

personality:
  default: "neo"
  directory: "config/personalities"

api:
  host: "127.0.0.1"
  port: 8888

context_budget:
  system_personality: 1500
  tool_schemas: 2000
  retrieved_memories: 2000
  recent_conversation: 5000
  world_state: 750
  robot_state: 375
  generation_headroom: 3500

logging:
  level: "INFO"
  directory: "logs"
  structured: true
