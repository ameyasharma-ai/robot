[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-core"
version = "1.0.0"
description = "Local-first humanoid robot brain: full-duplex voice, persistent memory, agentic tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ameya Sharma"}
]

dependencies = [
    # Core async
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "websockets>=14.0",

    # Audio & Vision
    "sounddevice>=0.5.0",
    "numpy>=2.1.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0",

    # VAD
    "silero-vad>=6.0",
    "torch>=2.4.0",

    # TTS
    "piper-tts>=1.8.0",
    "onnxruntime>=1.20.0",

    # LLM client
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "tiktoken>=0.7.0",

    # TTS model runtimes (guarded imports; ONNX-backed voices)
    "kokoro-onnx>=0.6",

    # OCR & browser automation tool backends (guarded imports)
    "pytesseract>=0.3.10",
    "playwright>=1.40",

    # System resources (process supervision, memory pressure checks)
    "psutil>=5.9",

    # Memory
    "mem0ai>=0.1.0",
    "qdrant-client>=1.12.0",

    # Database
    "aiosqlite>=0.20.0",

    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Telemetry
    "rich>=13.0",
    "structlog>=24.0",

    # HTTP
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    "graphifyy>=0.1.0",
]

# Heavy ML backends. All are imported through guarded (try/except or in-function)
# imports in src/robot, so the core app, tests, and CI run fine without them;
# install this extra to enable face mesh (mediapipe), YOLO tracking
# (ultralytics) and local diffusion image generation (diffusers).
full = [
    "mediapipe>=1.0",
    "ultralytics>=8.0",
    "diffusers>=0.30",
]

[project.scripts]
robot = "robot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
