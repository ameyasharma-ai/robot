name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # libportaudio2 lets sounddevice import; alsa utils mirror the Docker image.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      # CPU-only torch (~190 MB) from the PyTorch index: the default PyPI wheel
      # bundles multi-GB CUDA libs. silero-vad requires torch+torchaudio.
      - name: Install CPU-only torch
        run: pip install --no-cache-dir "torch>=2.4.0" torchaudio --index-url https://download.pytorch.org/whl/cpu

      # Installs the project + dev extra (pytest, pytest-asyncio, pytest-cov, ruff, graphifyy).
      # Heavy guarded ML backends (mediapipe, ultralytics, diffusers — the "full"
      # extra) are intentionally skipped: all 365 tests collect and pass without
      # them (verified against a clean venv), keeping install under ~2 minutes.
      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -q
